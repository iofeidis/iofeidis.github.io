bio: |
  I’m a Ph.D. candidate in Electrical and Computer Engineering at Yale, advised by Prof. [Leandros Tassiulas](https://engineering.yale.edu/research-and-faculty/faculty-directory/leandros-tassiulas). My research sits at the intersection of AI and networked systems, with a focus on Collaborative Learning (Federated, Split) for multimodal models under communication and compute constraints. Before the Ph.D., I was a Research Engineer at the [Yale Institute for Network Science (YINS)](https://yins.yale.edu/), and earlier a Research Assistant at the [Centre for Research & Technology Hellas (CERTH)](https://www.certh.gr/)/[INAB](https://www.inab.certh.gr/).

